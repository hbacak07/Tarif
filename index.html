<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Tarif Defteri</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>
  :root{
    --bg:#efede3;
    --surface:#faf8f0;
    --surface-2:#e6e2d3;
    --ink:#26231c;
    --ink-muted:#6b6558;
    --ink-faint:#9a927e;
    --accent:#4b6b4f;
    --accent-ink:#faf8f0;
    --accent-soft:#dde6dc;
    --gold:#a8763e;
    --border:#ddd8c8;
    --shadow:0 1px 2px rgba(38,35,28,0.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1b1a16;
      --surface:#242219;
      --surface-2:#2b2920;
      --ink:#ede9dd;
      --ink-muted:#a39c89;
      --ink-faint:#6e6858;
      --accent:#8fb596;
      --accent-ink:#14180f;
      --accent-soft:#2c352a;
      --gold:#d9ae72;
      --border:#34301f;
      --shadow:0 1px 2px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1b1a16;
    --surface:#242219;
    --surface-2:#2b2920;
    --ink:#ede9dd;
    --ink-muted:#a39c89;
    --ink-faint:#6e6858;
    --accent:#8fb596;
    --accent-ink:#14180f;
    --accent-soft:#2c352a;
    --gold:#d9ae72;
    --border:#34301f;
    --shadow:0 1px 2px rgba(0,0,0,0.4);
  }

  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
    color:var(--ink);
    font-family:"Newsreader", Georgia, "Times New Roman", serif;
  }
  ::selection{ background:var(--accent-soft); }

  .app{
    height:100vh;
    height:100dvh;
    display:flex;
    padding:16px;
    gap:14px;
  }

  /* ---------- rail ---------- */
  .rail{
    flex:0 0 220px;
    display:flex;
    flex-direction:column;
    gap:10px;
    min-width:0;
  }
  .rail-head{ padding:8px 12px 10px; }
  .rail-head .mark{
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-faint);
  }
  .rail-head h1{
    margin:4px 0 4px;
    font-size:19px;
    font-weight:600;
    letter-spacing:-0.01em;
    text-wrap:balance;
  }
  .rail-head .sub{
    font-size:11.5px;
    line-height:1.4;
    color:var(--ink-muted);
    font-style:italic;
  }
  .rail nav{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:6px;
    overflow:hidden;
  }
  .entry-btn{
    all:unset;
    cursor:pointer;
    display:flex;
    align-items:flex-start;
    gap:9px;
    padding:9px 11px;
    border-radius:8px;
    border:1px solid transparent;
    background:transparent;
  }
  .entry-btn .no{
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:11px;
    color:var(--ink-faint);
    padding-top:1px;
    min-width:16px;
  }
  .entry-btn .lbl{
    font-size:13.5px;
    line-height:1.3;
    color:var(--ink-muted);
    font-weight:500;
  }
  .entry-btn:hover{ background:var(--surface-2); }
  .entry-btn:hover .lbl{ color:var(--ink); }
  .entry-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .entry-btn[aria-current="true"]{ background:var(--accent); border-color:var(--accent); }
  .entry-btn[aria-current="true"] .no{ color:var(--accent-ink); opacity:.75; }
  .entry-btn[aria-current="true"] .lbl{ color:var(--accent-ink); font-weight:600; }

  .rail-foot{
    padding:10px 12px 4px;
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:10.5px;
    color:var(--ink-faint);
    line-height:1.5;
  }
  .rail-foot kbd{
    font-family:inherit;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:4px;
    padding:0 4px;
  }

  /* ---------- main ---------- */
  main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .entry-head{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:var(--shadow);
    padding:9px 12px;
    display:flex;
    align-items:center;
    gap:12px;
    flex:0 0 auto;
  }
  .nav-arrow{
    all:unset;
    cursor:pointer;
    flex:0 0 auto;
    width:32px;
    height:32px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:999px;
    border:1px solid var(--border);
    color:var(--ink-muted);
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:16px;
    line-height:1;
  }
  .nav-arrow:hover{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent); }
  .nav-arrow:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .nav-arrow:active{ transform:scale(.94); }
  .title-wrap{
    flex:1;
    min-width:0;
    display:flex;
    align-items:baseline;
    gap:12px;
  }
  .entry-head h2{
    margin:0;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:clamp(18px, 2.6vw, 25px);
    font-weight:600;
    letter-spacing:-0.01em;
    color:var(--ink);
  }
  .entry-head .counter{
    flex:0 0 auto;
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:11px;
    color:var(--ink-faint);
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .entry-head .tag{
    flex:0 0 auto;
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.1em;
    white-space:nowrap;
    padding:3px 8px;
    border-radius:999px;
    border:1px solid var(--border);
    color:var(--ink-muted);
  }
  .entry-head .tag.real{ color:var(--accent); border-color:var(--accent); }

  .sections{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-rows:1.35fr 1fr 0.75fr;
    gap:10px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:var(--shadow);
    padding:12px 20px;
    min-height:0;
    display:grid;
    grid-template-columns:30px 1fr;
    gap:12px;
    align-items:start;
  }
  .card .num{
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:18px;
    font-weight:600;
    color:var(--ink-faint);
    line-height:1;
    padding-top:2px;
  }
  .card-body{
    min-height:0;
    display:flex;
    flex-direction:column;
    gap:4px;
    height:100%;
  }
  .card-body h3{
    margin:0;
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--ink-muted);
  }
  .card-body p{
    margin:0;
    line-height:1.42;
    color:var(--ink);
    overflow:hidden;
    display:-webkit-box;
    -webkit-box-orient:vertical;
  }
  .card.prompt{ border-left:3px solid var(--ink-faint); }
  .card.prompt p{
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:clamp(10.5px, 1.35vh, 13px);
    line-height:1.48;
    -webkit-line-clamp:9;
  }
  .card.claude{ border-left:3px solid var(--accent); }
  .card.claude .num{ color:var(--accent); }
  .card.claude p{ font-size:clamp(12px, 1.5vh, 14.5px); -webkit-line-clamp:5; }
  .card.learned{ border-left:3px solid var(--gold); }
  .card.learned .num{ color:var(--gold); }
  .card.learned p{ font-size:clamp(12px, 1.5vh, 14.5px); -webkit-line-clamp:3; }

  .placeholder{ color:var(--ink-faint); font-style:italic; }

  /* ---------- phone width ---------- */
  @media (max-width:640px){
    .app{ flex-direction:column; padding:10px; gap:8px; }
    .rail{ flex:0 0 auto; flex-direction:row; align-items:center; gap:8px; }
    .rail-head{ padding:2px 6px; flex:0 0 auto; }
    .rail-head h1{ font-size:14px; }
    .rail-head .mark,.rail-head .sub{ display:none; }
    .rail nav{ flex-direction:row; flex:1; overflow-x:auto; gap:6px; }
    .entry-btn{ padding:6px 9px; }
    .entry-btn .no{ display:none; }
    .entry-btn .lbl{ font-size:11.5px; white-space:nowrap; }
    .rail-foot{ display:none; }
    .entry-head{ padding:6px 8px; gap:8px; }
    .entry-head h2{ font-size:14px; }
    .entry-head .tag{ display:none; }
    .entry-head .counter{ font-size:9.5px; }
    .nav-arrow{ width:28px; height:28px; font-size:14px; }
    .card{ padding:8px 12px; grid-template-columns:20px 1fr; gap:8px; }
    .card .num{ font-size:14px; }
    .card-body h3{ font-size:9px; }
    .card.prompt p{ font-size:9.5px; -webkit-line-clamp:7; }
    .card.claude p{ font-size:10.5px; -webkit-line-clamp:4; }
    .card.learned p{ font-size:10.5px; -webkit-line-clamp:2; }
    .sections{ gap:6px; }
  }

  @media (prefers-reduced-motion: no-preference){
    .card-body{ transition:opacity .15s ease; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="rail">
    <div class="rail-head">
      <div class="mark">Prompt Günlüğü</div>
      <h1>Tarif Defteri</h1>
      <div class="sub">Bu kursa yeni başlayanlar için: 5 prompt, tam metniyle, ne oldu ve ne öğrenildi.</div>
    </div>
    <nav id="entryNav" aria-label="Prompt listesi"></nav>
    <div class="rail-foot">Kaydırma yok — her kayıt<br>tek bir sayfa. <kbd>←</kbd> <kbd>→</kbd> ile gezin.</div>
  </div>

  <main>
    <div class="entry-head">
      <button class="nav-arrow" id="prevBtn" type="button" aria-label="Önceki tarif">‹</button>
      <div class="title-wrap">
        <h2 id="titleLabel"></h2>
        <span class="tag" id="tagLabel"></span>
      </div>
      <span class="counter" id="counterLabel"></span>
      <button class="nav-arrow" id="nextBtn" type="button" aria-label="Sonraki tarif">›</button>
    </div>
    <div class="sections">
      <div class="card prompt">
        <span class="num">1</span>
        <div class="card-body">
          <h3>Prompt — Tam Metin</h3>
          <p id="promptText"></p>
        </div>
      </div>
      <div class="card claude">
        <span class="num">2</span>
        <div class="card-body">
          <h3>Claude Ne Yaptı</h3>
          <p id="claudeText"></p>
        </div>
      </div>
      <div class="card learned">
        <span class="num">3</span>
        <div class="card-body">
          <h3>Ne Öğrendim</h3>
          <p id="learnedText"></p>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  const ENTRIES = [
    {
      label: "Konu & Kitle Sorusu",
      tag: "gerçek prompt",
      real: true,
      prompt: "Bana insanların en çok aradığı, ilgisini çeken konu başlıklarını, platform, kitle bilgisi verebilir misin",
      claude: "On bir satırlık bir tablo çıkardı: finans, sağlık, oyun, eğitim… Hepsi doğruydu, hiçbiri benim değildi. Elimde karar değil, daha çok seçenek kaldı.",
      learned: "Hedefi olmayan soru ansiklopedi maddesi getiriyor. Model bilmediğim şeyi değil, sormadığım şeyi eksik bırakıyor."
    },
    {
      label: "Mülakat Sonra Öneri",
      tag: "gerçek prompt",
      real: true,
      prompt: "Önce benimle bir mülakat yap, sonra öneride bulun. Bu soruları teker teker sor, bir sonrakine geçmeden cevabımı bekle: […] Kural: yalnızca sana gerçekten söylediklerimi kullan; bahsetmediğim becerileri asla uydurma. Bir cevabım belirsizse tahmin etme, hangisini yeniden cevaplamam gerektiğini söyle.",
      claude: "Dört soruyu tek tek sordu ve her birinde durdu. Sonunda çıkan üç öneri de benim kendi cümlelerimden kuruldu — bana ait olmayan tek bir beceri eklenmedi.",
      learned: "İşi yapan şey soruların kendisi değildi. 'Bekle' ve 'uydurma' talimatlarıydı: biri sırayı, diğeri kaynağı kilitledi."
    },
    {
      label: "Tarif Defteri Talebi",
      tag: "gerçek prompt",
      real: true,
      prompt: "En iyi promptlarını belgeleyen küçük bir site yap. Kısıt: her kayıt tek ekran, kaydırma yok. Kendini sıkıştırmaya zorla. Yayınla ve URL'i gönder. Okuyucuların, önümüzdeki ay bu kursa başlayacak insanlar.",
      claude: "Siteyi kurdu, ama URL gelmedi: yayınlama onun elinde değil. Buna karşılık 'tek ekran' kısıtı metni gerçekten kısalttı — beş kayıt üçe indi, her cümle kırpıldı.",
      learned: "Kısıt, kalite kontrolünün kendisi. Sınır koymadığım her yerde uzun ve dolgulu metin geliyor. Okuyucuyu adlandırmak da tonu tek başına değiştirdi."
    },
    {
      label: "Blog Sitesi",
      tag: "gerçek prompt",
      real: true,
      prompt: "Bana bir tane blog sitesi oluştur.",
      claude: "Önce netleştirici sorular sordu; cevaplara göre basit bir kişisel blog sitesi hazırladı. Ardından daha önce hazırlanmış bir CV verilip bu bilgilere göre siteyi düzenlemesi istendiğinde, verilen detaylara göre siteyi güncelledi.",
      learned: "İsteğimi tam olarak belirtmem gerekiyormuş. İsteğimi ve detayları verince güzel bir blog sitesi hazırladı."
    },
    {
      label: "Ev Yemekleri Firma Sitesi",
      tag: "gerçek prompt",
      real: true,
      prompt: "Bana bir tane ev de yemek yapan bir firma için bir internet sitesi oluştur.",
      claude: "Bir web sitesi hazırladı; sonrasında istenen detaylar girilerek sayfa güncellendi.",
      learned: "Detayları girdiğimde güzel sonuçlar üretebileceğimi öğrendim."
    }
  ];

  const nav = document.getElementById("entryNav");
  const titleLabel = document.getElementById("titleLabel");
  const tagLabel = document.getElementById("tagLabel");
  const counterLabel = document.getElementById("counterLabel");
  const promptText = document.getElementById("promptText");
  const claudeText = document.getElementById("claudeText");
  const learnedText = document.getElementById("learnedText");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");

  let current = 0;

  ENTRIES.forEach((e, i) => {
    const btn = document.createElement("button");
    btn.className = "entry-btn";
    btn.type = "button";
    btn.innerHTML = `<span class="no">0${i + 1}</span><span class="lbl">${e.label}</span>`;
    btn.addEventListener("click", () => select(i));
    nav.appendChild(btn);
  });

  function select(i){
    current = i;
    const e = ENTRIES[i];
    titleLabel.textContent = e.label;
    tagLabel.textContent = e.tag;
    tagLabel.classList.toggle("real", e.real);
    counterLabel.textContent = `${i + 1} / ${ENTRIES.length}`;
    promptText.textContent = e.prompt;
    claudeText.textContent = e.claude;
    learnedText.textContent = e.learned;
    [...nav.children].forEach((b, idx) => {
      if (idx === i) b.setAttribute("aria-current", "true");
      else b.removeAttribute("aria-current");
    });
    try { localStorage.setItem("prompt-tarif-defteri-index", String(i)); } catch(err) {}
  }

  prevBtn.addEventListener("click", () => select((current - 1 + ENTRIES.length) % ENTRIES.length));
  nextBtn.addEventListener("click", () => select((current + 1) % ENTRIES.length));

  document.addEventListener("keydown", (ev) => {
    if (ev.key === "ArrowRight") select((current + 1) % ENTRIES.length);
    if (ev.key === "ArrowLeft") select((current - 1 + ENTRIES.length) % ENTRIES.length);
  });

  let start = 0;
  try {
    const saved = localStorage.getItem("prompt-tarif-defteri-index");
    if (saved !== null) start = Math.min(ENTRIES.length - 1, Math.max(0, parseInt(saved, 10) || 0));
  } catch(err) {}
  select(start);
</script>
</body>
</html>
